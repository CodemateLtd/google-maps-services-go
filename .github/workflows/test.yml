name: Test
on: [push, pull_request, workflow_call]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: actions/setup-go@v7.0.0
      with:
        go-version: 'stable'
      id: go
    - run: go build -v ./...
    - run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...
    - uses: codecov/codecov-action@v7.1.1
      with:
        files: ./coverage.txt
  minimum-go:
    runs-on: ubuntu-latest
    env:
      GOPATH: ${{ github.workspace }}/gopath
    defaults:
      run:
        working-directory: gopath/src/googlemaps.github.io/maps
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        path: gopath/src/googlemaps.github.io/maps
    - uses: actions/setup-go@v7.0.0
      with:
        go-version: 'stable'
        cache: false
    - name: Vendor the declared dependencies
      run: go mod vendor
    - uses: actions/setup-go@v7.0.0
      with:
        go-version: '1.8.7'
        cache: false
    - run: go version
    # Old Go's ./... includes vendor; test this repository's packages only.
    - run: go build -v . ./internal ./metrics ./examples/...
    - run: go test -v . ./internal ./metrics ./examples/...

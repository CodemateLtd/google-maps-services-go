name: Release
on:
  push:
    branches: [ master ]
jobs:
  release:
    runs-on: ubuntu-latest    
    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1
      with:
        token: ${{ secrets.SYNCED_GITHUB_TOKEN_REPO }}
        fetch-depth: 0
        
    - uses: actions/setup-node@v7.1.0
      with:
        node-version: '24'
        check-latest: true
    - name: Semantic Release
      run: >-
        npm exec --yes
        --package=semantic-release@25.0.9
        --package=@semantic-release/commit-analyzer@13.0.1
        --package=@semantic-release/release-notes-generator@14.1.1
        --package=@semantic-release/git@11.0.1
        --package=@semantic-release/github@12.0.11
        -- semantic-release
      env:
        GH_TOKEN: ${{ secrets.SYNCED_GITHUB_TOKEN_REPO }}
